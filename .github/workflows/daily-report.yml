name: Daily Status & Analytics Report

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (09:00 AM hora local española)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual instantánea desde GitHub

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run Daily Report Script (Email + WhatsApp)
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          CALLMEBOT_PHONE: '34673109486'
          CALLMEBOT_API_KEY: '2243347'
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL || 'Mynextbymusa@gmail.com' }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: '88059fc16ce7af95af8a73c203ea5f8a'
          CLOUDFLARE_ZONE_ID: '1a8e1aaab60878d8bf2f6fd49086109d'
          VITE_SUPABASE_URL: 'https://elfdkbqlvawaprgidqhd.supabase.co'
          VITE_SUPABASE_ANON_KEY: 'sb_publishable_9qAEy3xuzB8HU2wSW1e36w_n051oO66'
        run: |
          node scripts/generate_daily_report.js

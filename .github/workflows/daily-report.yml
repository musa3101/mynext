name: Daily Status Report

on:
  schedule:
    # Se ejecuta todos los días a las 07:00 UTC (9:00 AM hora local española)
    - cron: '0 7 * * *'
  workflow_dispatch: # Permite ejecución manual desde GitHub

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Run Status Check and Email Report
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          # 1. Comprobar el estado del sitio web
          WEB_URL="https://mynextbymusa.com"
          echo "Comprobando estado del sitio web: $WEB_URL..."
          WEB_STATUS=$(curl -o /dev/null -s -w "%{http_code}" -H "User-Agent: Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" "$WEB_URL")
          
          # 2. Comprobar el estado de la base de datos Supabase
          DB_URL="https://elfdkbqlvawaprgidqhd.supabase.co"
          DB_ANON_KEY="sb_publishable_9qAEy3xuzB8HU2wSW1e36w_n051oO66"
          echo "Comprobando estado de la base de datos..."
          DB_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X GET "$DB_URL/rest/v1/mynext_projects?select=id&limit=1" \
            -H "apikey: $DB_ANON_KEY" \
            -H "Authorization: Bearer $DB_ANON_KEY")
          
          # 3. Determinar badges HTML y estados
          if [ "$WEB_STATUS" -eq 200 ] || [ "$WEB_STATUS" -eq 301 ] || [ "$WEB_STATUS" -eq 302 ]; then
            WEB_TEXT="Activa ($WEB_STATUS)"
            WEB_CLASS="active"
            WEB_BADGE="🟢 ACTIVA"
          else
            WEB_TEXT="Caída ($WEB_STATUS)"
            WEB_CLASS="inactive"
            WEB_BADGE="🔴 CAÍDA"
          fi
          
          if [ "$DB_STATUS" -eq 200 ]; then
            DB_TEXT="Activa ($DB_STATUS)"
            DB_CLASS="active"
            DB_BADGE="🟢 ACTIVA"
          else
            DB_TEXT="Caída/Pausada ($DB_STATUS)"
            DB_CLASS="inactive"
            DB_BADGE="🔴 CAÍDA"
          fi
          
          # 4. Asunto del correo (con alerta si algo falla)
          if [ "$WEB_STATUS" -ne 200 ] && [ "$WEB_STATUS" -ne 301 ] && [ "$WEB_STATUS" -ne 302 ] || [ "$DB_STATUS" -ne 200 ]; then
            SUBJECT="⚠️ ALERTA: Caída de servicio detectada en Mynext"
          else
            SUBJECT="🟢 Reporte Diario de Estado - Mynext (Todo OK)"
          fi
          
          echo "Web: $WEB_BADGE, DB: $DB_BADGE"
          
          # 5. Construir HTML del correo con diseño ultra premium compatible con Gmail
          HTML_BODY="<!DOCTYPE html>
          <html>
          <head>
            <meta charset='utf-8'>
            <style>
              body {
                font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
                background-color: #09090b;
                color: #e4e4e7;
                margin: 0;
                padding: 30px 15px;
              }
              .wrapper {
                background-color: #09090b;
                width: 100%;
                padding: 30px 0;
              }
              .container {
                max-width: 500px;
                margin: 0 auto;
                background-color: #121214;
                border: 1px solid #27272a;
                border-radius: 16px;
                padding: 32px 24px;
              }
              .header {
                text-align: center;
                margin-bottom: 28px;
                border-bottom: 1px solid #27272a;
                padding-bottom: 20px;
              }
              .logo {
                font-size: 26px;
                font-weight: 800;
                letter-spacing: 2px;
                color: #ffffff;
                margin: 0;
              }
              .logo span {
                color: #00f2ff;
              }
              .subtitle {
                font-size: 13px;
                color: #a1a1aa;
                margin-top: 6px;
                text-transform: uppercase;
                letter-spacing: 1px;
              }
              .status-item {
                background-color: #18181b;
                border: 1px solid #27272a;
                border-radius: 12px;
                padding: 16px 20px;
                margin-bottom: 16px;
              }
              .status-title {
                font-size: 14px;
                font-weight: 600;
                color: #f4f4f5;
                display: inline-block;
                vertical-align: middle;
              }
              .status-badge {
                float: right;
                font-size: 11px;
                font-weight: 700;
                padding: 4px 12px;
                border-radius: 20px;
                text-transform: uppercase;
                letter-spacing: 0.5px;
              }
              .status-badge.active {
                background-color: rgba(16, 185, 129, 0.1);
                color: #34d399;
                border: 1px solid rgba(16, 185, 129, 0.2);
              }
              .status-badge.inactive {
                background-color: rgba(239, 68, 68, 0.1);
                color: #f87171;
                border: 1px solid rgba(239, 68, 68, 0.2);
              }
              .footer {
                text-align: center;
                margin-top: 28px;
                font-size: 11px;
                color: #71717a;
                border-top: 1px solid #27272a;
                padding-top: 20px;
              }
            </style>
          </head>
          <body>
            <div class='wrapper'>
              <div class='container'>
                <div class='header'>
                  <h1 class='logo'>MY<span>NEXT</span></h1>
                  <div class='subtitle'>Reporte Diario de Estado</div>
                </div>
                
                <div class='status-item'>
                  <span class='status-title'>🌐 Sitio Web (mynextbymusa.com)</span>
                  <span class='status-badge ${WEB_CLASS}'>${WEB_TEXT}</span>
                </div>
                
                <div class='status-item'>
                  <span class='status-title'>⚡ Base de Datos (Supabase)</span>
                  <span class='status-badge ${DB_CLASS}'>${DB_TEXT}</span>
                </div>
                
                <div class='footer'>
                  Este reporte fue generado de forma automática a las 09:00 AM (CEST).<br>
                  Google Antigravity Setup &copy; 2026
                </div>
              </div>
            </div>
          </body>
          </html>"
          
          # Escapar comillas para JSON seguro
          ESCAPED_HTML=$(echo "$HTML_BODY" | jq -aRs .)
          
          # 6. Enviar mediante API de Resend
          if [ -z "$RESEND_API_KEY" ]; then
            echo "❌ ERROR: RESEND_API_KEY no está configurado."
            exit 1
          fi
          
          echo "Enviando email a mynextbymusa@gmail.com..."
          
          RESPONSE_CODE=$(curl -s -o /dev/null -w "%{http_code}" -X POST "https://api.resend.com/emails" \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d "{\"from\": \"Mynext Status <onboarding@resend.dev>\", \"to\": [\"mynextbymusa@gmail.com\"], \"subject\": \"$SUBJECT\", \"html\": $ESCAPED_HTML}")
          
          if [ "$RESPONSE_CODE" -eq 200 ] || [ "$RESPONSE_CODE" -eq 201 ]; then
            echo "¡Email enviado con éxito! Código HTTP: $RESPONSE_CODE"
          else
            echo "❌ ERROR: Falló el envío del email. Código HTTP: $RESPONSE_CODE"
            exit 1
          fi
